name: backtest-002475
on:
  workflow_dispatch:
  push:
    paths:
      - "backtest/**"
      - ".github/workflows/backtest-002475.yml"
jobs:
  backtest:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run 002475 walk-forward baseline and cost stress
        run: |
          set -o pipefail
          python backtest/run_002475.py | tee backtest-002475.txt
      - name: Run fixed-protocol multi-asset OOS
        run: |
          set -o pipefail
          python backtest/run_multi_asset.py | tee multi-asset-oos.txt
      - uses: actions/upload-artifact@v4
        with:
          name: backtest-research
          path: |
            backtest-002475.txt
            multi-asset-oos.txt
